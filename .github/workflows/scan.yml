name: Binance Long + Short Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod: scan (normal tarama) veya backtest"
        required: false
        default: "scan"
        type: choice
        options:
          - scan
          - backtest
      symbols:
        description: "Backtest için coinler (virgülle ayır)"
        required: false
        default: "BTCUSDT,ETHUSDT,SOLUSDT"
      days:
        description: "Backtest için kaç günlük veri"
        required: false
        default: "60"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backtest" ]; then
            python Bot.py --backtest --symbols "${{ github.event.inputs.symbols }}" --days "${{ github.event.inputs.days }}"
          else
            python Bot.py
          fi

      - name: Upload backtest results (varsa)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: backtest_results.csv
          if-no-files-found: ignore
