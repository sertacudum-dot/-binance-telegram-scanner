name: Binance Long + Short Scanner

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mod: scan / backtest / precursor"
        required: false
        default: "scan"
        type: choice
        options:
          - scan
          - backtest
          - precursor
      symbols:
        description: "Backtest için coinler (virgülle ayır)"
        required: false
        default: "BTCUSDT,ETHUSDT,SOLUSDT"
      days:
        description: "Backtest için kaç günlük veri"
        required: false
        default: "60"
      fee_pct:
        description: "Gidiş-dönüş işlem maliyeti (örn. 0.001 = %0.1). Boş bırakılırsa varsayılan kullanılır."
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: binance-scanner
      cancel-in-progress: false
    # ^ Tüm coin taraması eskisinden uzun sürebileceği için, aynı anda
    # iki taramanın üst üste binmesini engelliyoruz: yeni tetiklenen
    # çalışma, öncekinin bitmesini bekler (üst üste binip Telegram'a
    # çift mesaj atmak yerine kuyruğa girer).

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "backtest" ]; then
            FEE_ARG=""
            if [ -n "${{ github.event.inputs.fee_pct }}" ]; then
              FEE_ARG="--fee-pct ${{ github.event.inputs.fee_pct }}"
            fi
            python Bot.py --backtest --symbols "${{ github.event.inputs.symbols }}" --days "${{ github.event.inputs.days }}" $FEE_ARG
          elif [ "${{ github.event.inputs.mode }}" = "precursor" ]; then
            python Bot.py --precursor --symbols "${{ github.event.inputs.symbols }}" --days "${{ github.event.inputs.days }}"
          else
            python Bot.py
          fi

      - name: Upload backtest results (varsa)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: backtest_results.csv
          if-no-files-found: ignore
